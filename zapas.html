const totals = {
  "Итого": "3659.713",
  "А": "711.901",
  "В": "1541.452",
  "С1": "326.238",
  "С2": "896.504"
};

// pagination / rendering
let currentPage = 1;
let perPage = 25;
const tbody = document.getElementById('zapasBody');
const paginationEl = document.getElementById('pagination');
const totalCountEl = document.getElementById('total-count');
const searchInput = document.getElementById('search');
const perPageSelect = document.getElementById('perPage');

// Set totals in footer
document.getElementById('total-sum').textContent = totals["Итого"];
document.getElementById('total-a').textContent = totals["А"];
document.getElementById('total-b').textContent = totals["В"];
document.getElementById('total-c1').textContent = totals["С1"];
document.getElementById('total-c2').textContent = totals["С2"];

totalCountEl.textContent = data.length;

function renderTable(page=1, rows=data) {
  tbody.innerHTML = '';
  const start = (page-1)*perPage;
  const paged = rows.slice(start, start+perPage);
  for (let r of paged) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r['№ п/п']}</td>
                    <td>${r['Местоположение']}</td>
                    <td>${r['Наименование объекта']}</td>
                    <td>${r['Год утверждения запасов']}</td>
                    <td>${r['Итого']}</td>
                    <td>${r['А']}</td>
                    <td>${r['В']}</td>
                    <td>${r['С1']}</td>
                    <td>${r['С2']}</td>`;
    tbody.appendChild(tr);
  }
  renderPagination(rows);
}

function renderPagination(rows) {
  paginationEl.innerHTML = '';
  const pageCount = Math.ceil(rows.length / perPage) || 1;
  const createBtn = (i, label=null) => {
    const btn = document.createElement('button');
    btn.textContent = label || i;
    if (i === currentPage) btn.classList.add('active');
    btn.addEventListener('click', ()=>{ currentPage = i; renderTable(i, filteredData()); window.scrollTo({top:0,behavior:'smooth'}); });
    return btn;
  };
  if (currentPage > 1) {
    const prev = document.createElement('button'); prev.textContent='◀'; prev.addEventListener('click', ()=>{ currentPage--; renderTable(currentPage, filteredData()); }); paginationEl.appendChild(prev);
  }
  const startPage = Math.max(1, currentPage-2);
  const endPage = Math.min(pageCount, currentPage+2);
  if (startPage > 1) paginationEl.appendChild(createBtn(1,'1'));
  if (startPage > 2) {
    const dots = document.createElement('span'); dots.textContent='...'; paginationEl.appendChild(dots);
  }
  for (let i=startPage;i<=endPage;i++) paginationEl.appendChild(createBtn(i));
  if (endPage < pageCount-1) {
    const dots = document.createElement('span'); dots.textContent='...'; paginationEl.appendChild(dots);
  }
  if (endPage < pageCount) paginationEl.appendChild(createBtn(pageCount, String(pageCount)));
  if (currentPage < pageCount) {
    const next = document.createElement('button'); next.textContent='▶'; next.addEventListener('click', ()=>{ currentPage++; renderTable(currentPage, filteredData()); }); paginationEl.appendChild(next);
  }
}

function filteredData() {
  const q = (searchInput.value || '').toLowerCase().trim();
  if (!q) return data;
  return data.filter(r => (r['Местоположение']||'').toLowerCase().includes(q) || (r['Наименование объекта']||'').toLowerCase().includes(q));
}

searchInput.addEventListener('input', ()=>{ currentPage = 1; renderTable(1, filteredData()); });
perPageSelect.addEventListener('change', ()=>{ perPage = parseInt(perPageSelect.value,10); currentPage=1; renderTable(1, filteredData()); });

renderTable(1, data);
</script>
